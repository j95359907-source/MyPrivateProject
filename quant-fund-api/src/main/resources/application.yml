server:
  port: 8080

spring:
  application:
    name: china-quant-fund

  datasource:
    url: jdbc:mysql://localhost:3306/quant_fund?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: quantfund
    password: quantfund123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none  # Flyway全权管理DDL
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration  # 从quant-fund-common加载
    baseline-on-migrate: true
    baseline-version: 0

  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# Quartz 调度器
spring.quartz:
  job-store-type: memory
  properties:
    org.quartz.threadPool.threadCount: 5

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# 应用配置
app:
  data:
    eastmoney:
      connect-timeout: 30s
      read-timeout: 60s
      request-delay-ms: 200  # 请求间隔，避免被封
  sync:
    fund-list-cron: "0 0 2 * * SAT"
    nav-evening-cron: "0 0 19 * * MON-FRI"
    nav-night-cron: "0 0 22 * * MON-FRI"
  backtest:
    max-threads: 4
    default-commission: chinese_fund

# 日志
logging:
  level:
    root: INFO
    com.quantfund: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
